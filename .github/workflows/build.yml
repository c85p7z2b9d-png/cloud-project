name: Cloud Deploy Automation

on:
  push:
    branches: [ "main" ]
    
permissions:
  contents: read
  id-token: write
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
     - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4

    - name: Deploy to AWS via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ubuntu
        key: ${{ secrets.SSH_KEY }}
        script: |
          mkdir -p ~/app && cd ~/app
          
          cat << 'INNER_EOF' > app.py
          import time
          print("🚀 Автоматичний сервер в AWS запустився!", flush=True)
          while True:
              print("💻 Сервер працює стабільно в хмарі...", flush=True)
              time.sleep(5)
          INNER_EOF

          cat << 'INNER_EOF' > Dockerfile
          FROM python:3.11-slim
          WORKDIR /app
          COPY . .
          CMD ["python", "app.py"]
          INNER_EOF

          docker build -t my-aws-app .
          docker stop my-running-aws-server || true
          docker rm my-running-aws-server || true
          docker run -d --name my-running-aws-server my-aws-app
