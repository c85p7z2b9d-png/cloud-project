name: Cloud Deploy Automation

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to AWS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.HOST }}
        username: ubuntu
        key: ${{ secrets.SSH_KEY }}
        script: |
          mkdir -p ~/app && cd ~/app
          cp ~/Desktop/cloud-project/Dockerfile . || echo "FROM python:3.11-slim\nWORKDIR /app\nCOPY . .\nCMD [\"python\", \"app.py\"]" > Dockerfile
          cat << 'INNER_EOF' > app.py
          import time
          print("🚀 Автоматичний сервер в AWS запустився!", flush=True)
          while True:
              print("💻 Сервер працює стабільно в хмарі...", flush=True)
              time.sleep(5)
          INNER_EOF
          docker build -t my-aws-app .
          docker stop my-running-aws-server || true
          docker rm my-running-aws-server || true
          docker run -d --name my-running-aws-server my-aws-app
