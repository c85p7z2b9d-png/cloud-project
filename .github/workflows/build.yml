name: Docker Build Automation

# 1. Тригер: коли саме роботу прокидатися
on:
  push:
    branches: [ "main" ]

# 2. Кроки: що саме роботу робити
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Check out our code
      uses: actions/checkout@v4

    - name: Build Docker Image
      run: docker build -t my-cloud-app:${{ github.sha }} .
